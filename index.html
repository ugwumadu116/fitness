function buildWorkout(type, lvl = currentLevel()) {
  const L = LEVELS[lvl];

    return [{ id: 'jog', ...EX.jog, sets: rounds, reps: run, rest: walk, restLabel: 'Walk' }];
  }
  const w = WORKOUTS[type]; if (!w.moves) return [];
  return w.moves.map(([id, reps]) => {

}

  flutter(s) {

  reclineRaise(s) {

    const arm = sx => [Wd(th, -2.25, sx * 0.3), Wd(th, -2.25, sx * 0.3)];
    return { pitch: th, arms: [...arm(1), ...arm(-1)],
      legs: [Wd(th, a, 0.08), Wd(th, a, 0.06), Wd(th, a, -0.08), Wd(th, a, -0.06)] };
  },
  bridge(s, side, t, one = 0, fig4 = 0) {

    const bent = sx => [Wd(th, 0.8 - 0.45 * e, sx * 0.15), Wd(th, -1.3 - 0.2 * e, sx * 0.08)];
    const arms = [Wd(th, -0.12, 0.25), Wd(th, -0.12, 0.2), Wd(th, -0.12, -0.25), Wd(th, -0.12, -0.2)];

    if (one) { const up = [Wd(th, HALF, 0.05), Wd(th, HALF, 0.04)]; if (side > 0) L = up; else R = up; }
    if (fig4) {
      const cross = [V(side * 0.75, Math.sin(1.0 + th), Math.cos(1.0 + th)), V(-side, Math.sin(0.3 + th) * 0.3, Math.cos(0.3 + th) * 0.3)];

  oneLegBridge(s, side, t) { return MOVES.bridge(s, side, t, 1); },
  fig4Bridge(s, side, t) { return MOVES.bridge(s, side, t, 0, 1); },
  spiderPlank(s, side, t) {

      legs: [Wd(th, -0.5, 0.14), Wd(th, Math.PI + 0.05, 0.08), Wd(th, -0.5, -0.14), Wd(th, Math.PI + 0.05, -0.08)] };

  catCow(s) {

      legs: [Wd(th, -HALF, 0.12), Wd(th, Math.PI + 0.05, 0.1), Wd(th, -HALF, -0.12), Wd(th, Math.PI + 0.05, -0.1)] };
  },
  cobra(s, side, t = 0) {
    const th = HALF, b = -0.95 - 0.04 * Math.sin(t * 1.2);

      arms: [Wd(th + b, -HALF, 0.3), Wd(th + b, -HALF, 0.2), Wd(th + b, -HALF, -0.3), Wd(th + b, -HALF, -0.2)],
      legs: [Wd(th, Math.PI - 0.05, 0.1), Wd(th, Math.PI - 0.05, 0.1), Wd(th, Math.PI - 0.05, -0.1), Wd(th, Math.PI - 0.05, -0.1)] };
  },
  pigeon(s, side) {
    const th = 0.35;
    const front = [V(side * 0.55, Math.sin(-0.3 + th), Math.cos(-0.3 + th)), V(-side, Math.sin(th - 0.3) * 0.25, Math.cos(th - 0.3) * 0.25)];

      arms: [Wd(th, -1.15, 0.3), Wd(th, -1.15, 0.25), Wd(th, -1.15, -0.3), Wd(th, -1.15, -0.25)],

  fig4Stretch(s, side) {

      legs: [...L, ...Rl],
      jump: 0,

  },
};

let jumpNow = 0, pitchNow = 0;
function pose(p, dt) {
  if (!B.Hips) return;
  pitchNow += ((p.pitch || 0) - pitchNow) * Math.min(1, dt * 5);
  orient.rotation.x = pitchNow;
  orient.position.y = hipH;
  allBones.forEach((b, i) => b.quaternion.copy(rest[i]));
  orient.updateMatrixWorld(true);
  applyPose(p);
  const a = 1 - Math.exp(-dt * 22);
  allBones.forEach((b, i) => { cur[i].slerp(b.quaternion, a); b.quaternion.copy(cur[i]); });
  orient.updateMatrixWorld(true);
  jumpNow += ((p.jump || 0) - jumpNow) * Math.min(1, dt * 30);
  orient.position.y = hipH - lowestY() + jumpNow + PLAT_H;
}

function dateForWeekday(wd) {          // this week's date for a weekday, Monday-first
  const d = new Date(); d.setHours(0, 0, 0, 0);

  d.setDate(d.getDate() + off); return d;
}

  wk.innerHTML = '';

function renderLevel() {

let actx;
function beep(f = 880, len = 0.08) {
  if (!voice) return;
  try {
    actx ||= new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; g.gain.setValueAtTime(0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + len);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + len);
  } catch {}
}

function drawTally(done, total) {
  const groups = Math.ceil(total / 5); const gw = 240 / Math.max(groups, 1);
  const unit = Math.min(gw * 0.78, 30); let d = '';
  let out = '';
  for (let i = 0; i < total; i++) {
    const g = Math.floor(i / 5), j = i % 5, x0 = g * gw + 2;
    const jitter = ((i * 37) % 7 - 3) * 0.35;
    const path = j < 4
      ? `M${x0 + j * unit / 4 + jitter} 10 L${x0 + j * unit / 4 - jitter} 42`
      : `M${x0 - 3} 36 L${x0 + unit * 0.75 + 3} 16`;
    out += `<path d="${path}" class="${i < done ? '' : 'todo'}"/>`;
  }
  ui.tally.innerHTML = out;
}

let wakeLock;

function startWorkout() {

  W = { plan, ex: 0, set: 0, phase: 'ready', t: GET_READY, paused: false, lastRep: 0, lastSec: GET_READY };

function endWorkout(finished) {

    const before = currentLevel(), doneType = SCHEDULE[selDay];
    const log = new Set(readLog()); log.add(`${dayKey(new Date())}|${doneType}`); writeLog([...log]);

function renderHud() {
  const ex = W.plan[W.ex];

  const unit = ex.hold ? 's' : ' reps';

  const sideName = ex.sides ? (W.set % 2 ? ' · right' : ' · left') : '';
  ui.name.textContent = resting && ex.restLabel && !first ? `${ex.restLabel} ${fmtSec(ex.rest)}` : ex.name + sideName;
  ui.set.textContent = `${ex.id === 'jog' ? 'Round' : 'Set'} ${W.set + 1} of ${ex.sets}`;
  ui.skipText.textContent = resting ? (ex.restLabel ? `Skip ${ex.restLabel.toLowerCase()}` : 'Skip rest') : 'Skip set';
  ui.tally.classList.toggle('hidden', resting || ex.hold);
  if (resting) { ui.n.textContent = Math.ceil(W.t); ui.of.textContent = `sec · then ${ex.name.toLowerCase()} ${ex.hold ? fmtSec(ex.reps) : ex.reps + unit}`; }
  else if (ex.hold) { const left = ex.reps - W.lastRep; ui.n.textContent = left >= 60 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : left; ui.of.textContent = 'sec left'; }
  else { ui.n.textContent = W.lastRep; ui.of.textContent = `/ ${ex.reps}`; drawTally(W.lastRep, ex.reps); }

function nextSet() {

    W.set++; W.phase = 'rest'; W.t = ex.rest || REST_SET;
    say(ex.restLabel ? `${ex.restLabel}. ${fmtSec(ex.rest).replace('s', ' seconds')}.` : ex.sides ? 'Switch sides.' : `Rest. ${ex.sets - W.set === 1 ? 'Last set' : 'Set ' + (W.set + 1)} coming up.`);
  } else if (W.ex + 1 < W.plan.length) {
    W.ex++; W.set = 0; W.phase = 'rest'; W.t = W.plan[W.ex].restEx || REST_EX;
    say(`Rest. Next, ${W.plan[W.ex].say}.`);

function tickWorkout(dt) {
  if (W.paused) return;
  const ex = W.plan[W.ex];
  if (W.phase !== 'go') {
    W.t -= dt;
    const sec = Math.ceil(W.t);
    if (sec !== W.lastSec) { W.lastSec = sec; if (sec <= 3 && sec > 0) beep(660); renderHud(); }
    if (W.t <= 0) { W.phase = 'go'; W.t = 0; W.lastRep = 0; beep(990, 0.18); if (ex.id === 'jog') say('Run!'); renderHud(); }
    return;
  }
  W.t += dt;
  const rep = Math.floor(W.t / ex.dur);
  if (rep !== W.lastRep) {
    W.lastRep = rep;
    if (!ex.hold) beep(rep % 5 === 0 ? 760 : 520, 0.04);
    else if (ex.reps - rep <= 3 && ex.reps - rep > 0) beep(660);
    else if (ex.hold && ex.reps - rep === 30 && ex.reps > 45) say('30 seconds left');
    renderHud();
    if (rep >= ex.reps) nextSet();
  }
}

const DEBUG = new URLSearchParams(location.search);
if (DEBUG.has('bare')) document.querySelector('.hud').style.display = 'none';
function currentPose(clock) {
  if (DEBUG.has('move')) { const m = DEBUG.get('move'), d = EX[m]?.dur || 1, ph = DEBUG.has('s') ? +DEBUG.get('s') : (clock % d) / d;
    return m === 'idle' ? MOVES.idle(clock) : MOVES[m](ph, +(DEBUG.get('side') || 1), clock); }
  if (!W) return MOVES.idle(clock);
  const ex = W.plan[W.ex];
  // between sets the body holds the start position of what's next, so you can get into it too
  const holdSide = W.set % 2 ? -1 : 1;
  if (W.phase !== 'go') return ex.id === 'jog' || !EX[ex.id].floor ? MOVES.idle(clock) : MOVES[ex.id](0, ex.sides ? holdSide : 1, clock);
  const s = (W.t % ex.dur) / ex.dur, rep = Math.floor(W.t / ex.dur);
  return MOVES[ex.id](s, ex.sides ? holdSide : rep % 2 ? -1 : 1, clock);
}

  if (!W) return; W.paused = !W.paused;
  $('pauseIcon').classList.toggle('hidden', W.paused); $('playIcon').classList.toggle('hidden', !W.paused);
  $('pauseBtn').setAttribute('aria-label', W.paused ? 'Resume' : 'Pause');
  if (W.paused) speechSynthesis?.cancel();
};
$('soundBtn').onclick = () => {
  voice = !voice;
  $('soundOn').classList.toggle('hidden', !voice); $('soundOff').classList.toggle('hidden', voice);
  $('soundBtn').setAttribute('aria-label', voice ? 'Mute voice' : 'Unmute voice');
  if (!voice) speechSynthesis?.cancel();
};
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('sheet').classList.contains('closed')) return openSheet(false);
  if (e.key === 'Escape' && W) endWorkout(false);
  if (e.key === ' ' && W && e.target === document.body) { e.preventDefault(); $('pauseBtn').click(); }
});

/* ---------- demo card: a real person doing the current move ---------- */
const DEMOS = {"twist": "ACy8D3XmMPE", "jack": "XR0xeuK5zBU", "windmill": "a-KqiYR7CZc", "knee": "ymdS7tM0zws", "crunch": "z1fwSujYhX8", "squat": "m0GcZ24pK6k", "lunge": "YnYA-ughpNQ", "pushup": "WDIpL0pjun0", "plank": "pvIjsG5Svck", "climber": "ixxk9Qfn61o", "floorCrunch": "O0pIQ2UqeCY", "legRaise": "3oIpxsn6FxQ", "bicycle": "eqg47ZuGZXQ", "russian": "wkD8rjkodUI", "jog": "eBQAa9dEalY", "clapUnder": "O_8EUJ7i-PI", "sameKnee": "K2Er6nfOpxk", "kneePress": "O_8EUJ7i-PI", "squatTwist": "bmFOq_bFw6w", "seatedTuck": "t1etqgnWrHo", "seatedTwist": "_cD9f078WQ4", "kneeCrunch": "1S8b8jgas8Q", "flutter": "eEG9uXjx4vQ", "reclineRaise": "EvleorZT7wU", "bridge": "OUgsJ8-Vi0E", "oneLegBridge": "AVAXhy6pl7o", "fig4Bridge": "OUgsJ8-Vi0E", "spiderPlank": "_7TDEL_vwxk", "hipDips": "em4gADvYvMA", "plankPike": "G-2oFuWRgNI", "childPose": "kH12QrSGedM", "catCow": "LIVJZZyZ2qM", "cobra": "JDcdhTuycOI", "pigeon": "op-eDU9eNqM", "hipFlexor": "YDJrofqHUlg", "fig4Stretch": "Xb5gHdYtHnk"};
let demoOn = (() => { try { return localStorage.getItem('fit-demo') !== 'off'; } catch { return true; } })(), demoId = null;
function syncDemo() {
  const ex = W && W.plan[W.ex], id = ex && ex.id !== 'jog' ? DEMOS[ex.id] : null;
  $('demo').classList.toggle('hidden', !id || !demoOn);
  $('demoShow').classList.toggle('hidden', !id || demoOn);
  if (!id) { if (demoId) { $('demoFrame').src = 'about:blank'; demoId = null; } return; }
  $('demoLabel').textContent = `How to · ${ex.name}`;
  if (demoOn && id !== demoId) {
    demoId = id;
    $('demoFrame').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1&rel=0&modestbranding=1`;
  }
}
$('demoHide').onclick = () => { demoOn = false; try { localStorage.setItem('fit-demo', 'off'); } catch {} $('demoFrame').src = 'about:blank'; demoId = null; syncDemo(); };
$('demoShow').onclick = () => { demoOn = true; try { localStorage.setItem('fit-demo', 'on'); } catch {} syncDemo(); };

/* ---------- confetti: kerb paint flying ---------- */
function confetti(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('confetti'), g = c.getContext('2d'), w = c.width = innerWidth, h = c.height = innerHeight;
  const cols = ['#F5C518', '#F2A93B', '#EDEAE2', '#161616'];
  const ps = Array.from({ length: n }, () => ({ x: w / 2 + (Math.random() - .5) * 80, y: h * .62, vx: (Math.random() - .5) * 13,
    vy: -6 - Math.random() * 11, r: Math.random() * 6, vr: (Math.random() - .5) * .4, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * 4)] }));
  let f = 0;
  (function step() {
    g.clearRect(0, 0, w, h);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (++f < 170) requestAnimationFrame(step); else g.clearRect(0, 0, w, h);
  })();
}

/* ---------- turning ---------- */
let spin = 0, dragging = false, lastX = 0, dragVel = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; dragVel = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; spin += dx * 0.01; dragVel = dx * 0.01; });
canvas.addEventListener('pointerup', () => { dragging = false; });
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; composer?.setSize(w, h);
  narrow = w / h < 0.8;
  camera.fov = narrow ? 38 : 30;
  camera.position.set(0, narrow ? 1.05 : 1.15, narrow ? 5.9 : 5.2);
  camera.updateProjectionMatrix();
}
// where the camera looks: idle leaves room for the headline above, a workout leaves room for the panel below
let narrow = false, lookY = 0.9;
let camDist = 5.6;
const onFloor = () => { const m = DEBUG.get('move') || (W && W.plan[W.ex].id); return !!(m && EX[m]?.floor); };
function aimCamera(dt) {
  const fl = onFloor();
  const want = fl ? (narrow ? 0.05 : 0.3) : narrow ? (W ? 0.55 : 1.1) : (W ? 0.75 : 0.62);
  const dist = narrow ? (fl ? 6.6 : W ? 5.9 : 7.2) : W ? 5.2 : 6.6;
  lookY += (want - lookY) * Math.min(1, dt * 4);
  camDist += (dist - camDist) * Math.min(1, dt * 4);
  camera.position.z = camDist;
  camera.lookAt(0, lookY, 0);
}
addEventListener('resize', resize); resize();
renderWeek();

const clock = new THREE.Clock(); let elapsed = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;
  if (W) {
    tickWorkout(dt);
    // face the camera at a three-quarter angle while working out
    const target = onFloor() ? 1.35 : 0.45;
    const diff = Math.atan2(Math.sin(target - spin), Math.cos(target - spin));
    if (!dragging) spin += diff * Math.min(1, dt * 3);
  } else if (!dragging) {
    dragVel *= 0.94;
    spin += reduce.matches || DEBUG.has('spin') ? dragVel + (DEBUG.has('spin') ? 0 : 0) : 0.07 * dt + dragVel;
    if (DEBUG.has('spin')) spin = +DEBUG.get('spin');
  }
  turntable.rotation.y = spin;
  fadeBoards();
  aimCamera(dt);
  pose(currentPose(elapsed), dt);
  composer ? composer.render() : renderer.render(scene, camera);
});
</script>
